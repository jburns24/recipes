# On every push to master: compute and push per-component tags
#   backend/vX.Y.Z   (changes in api/ or shared/)
#   frontend/vX.Y.Z  (changes in web/ or shared/)
# and trigger "Docker Build and Push" for each new tag. Bump rules live in .github/scripts/next-tag.sh
# (patch by default, feat -> minor, breaking -> major).
name: Release Workflow
on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for component in backend frontend; do
            tag="$(.github/scripts/next-tag.sh "$component")"
            if [ -z "$tag" ]; then
              echo "$component: no changes since last tag"
              continue
            fi
            echo "$component: tagging $tag"
            git tag -a "$tag" -m "$tag"
            git push origin "refs/tags/$tag"
            # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so dispatch explicitly.
            gh workflow run docker.yaml --ref "$tag"
          done
