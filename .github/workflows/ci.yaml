name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Required gate: eslint (no any / @ts-ignore), prettier --check, typecheck.
      - name: Lint and typecheck
        run: task lint

      - name: Unit tests
        run: task test:unit

      # test:e2e seeds data/ from archive/ (images are gitignored), starts API + vite dev and runs
      # Playwright. The old-site visual comparisons are macOS-only and skipped on Linux.
      - name: E2E tests
        run: task test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
