# Builds and pushes ghcr.io/<owner>/recipes-backend (on backend/v* tags) and
# ghcr.io/<owner>/recipes-frontend (on frontend/v* tags). Each image gets <version>, <sha> and
# latest tags. Run by release.yaml (workflow_dispatch on the new tag) or by pushing a tag by hand.
name: Docker Build and Push
on:
  push:
    tags:
      - 'backend/v*'
      - 'frontend/v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Only meaningful when run against a release tag (manual dispatch must select the tag as ref).
    if: startsWith(github.ref, 'refs/tags/backend/v') || startsWith(github.ref, 'refs/tags/frontend/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve component and version
        id: tag
        run: |
          name="${GITHUB_REF#refs/tags/}"
          echo "component=${name%%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${name##*/v}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/recipes-${{ steps.tag.outputs.component }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ steps.tag.outputs.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.component }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.component }}
