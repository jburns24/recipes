server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  include /etc/nginx/snippets/security-headers.conf;

  # The API is a separate service; proxy /api so the SPA stays same-origin. This file is an nginx
  # template: API_UPSTREAM is substituted at container start (default http://backend:3000).
  # A variable + resolver means nginx still starts when the upstream is not resolvable yet.
  location /api/ {
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  # Legacy static-site URLs: /routes/dinner/quick/meatloaf.html -> /routes/dinner/quick/meatloaf
  location ~ ^/(?<legacy>.+)\.html$ {
    return 301 /$legacy;
  }
  location = /index.html { return 301 /; }

  # Hashed build assets are immutable.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA fallback: everything else is served by the client router. A named location with
  # `rewrite ... break` serves index.html without re-running location matching; try_files
  # to /index.html would hit the legacy-redirect locations above and loop forever.
  location / {
    try_files $uri @spa;
  }
  location @spa {
    rewrite ^ /index.html break;
  }
}
